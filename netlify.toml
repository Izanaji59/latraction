# Configuration Netlify pour LATRACTION
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Dossier de publication (racine du projet)
  publish = "."
  
  # Commande de build explicite pour neutraliser une commande UI invalide (ex: hugo)
  command = "echo 'No build step required'"

# Redirections et réécritures
# NOTE: Les redirections sont gérées par le fichier _redirects à la racine
# Ce fichier _redirects est prioritaire sur les redirections définies ici
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
#   force = false

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers pour les assets statiques (cache)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Configuration des formulaires Netlify
# Les formulaires avec l'attribut 'netlify' seront automatiquement détectés
# Les soumissions seront disponibles dans le dashboard Netlify > Forms





